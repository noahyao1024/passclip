name: Passclip
options:
  bundleIdPrefix: noahyao
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L6Z5MV9G94
    GENERATE_INFOPLIST_FILE: YES
targets:
  Passclip:
    type: application
    platform: iOS
    sources:
      - path: Passclip
      - path: AppResources
      - path: ../prompts/extract-to-passclip.txt
        buildPhase: resources
    info:
      path: Generated/Passclip-Info.plist
      properties:
        CFBundleDisplayName: Passclip
        # Only HTTPS through Apple's own APIs, which is exempt from export paperwork.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # App Store Connect requires all four on iPad, for multitasking.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: Generated/Passclip.entitlements
      properties:
        com.apple.security.application-groups: [group.noahyao.passclip]
    dependencies:
      - target: PassclipShare
      # Apple's on-device model needs iOS 26; weak linking keeps the app launching on iOS 17 and later.
      - sdk: FoundationModels.framework
        weak: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: noahyao.passclip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  PassclipShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Passclip
        excludes: [PassclipApp.swift]
      - path: ../prompts/extract-to-passclip.txt
        buildPhase: resources
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Passclip
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Generated/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.noahyao.passclip]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: noahyao.passclip.share
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
    dependencies:
      - sdk: FoundationModels.framework
        weak: true
  PassclipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PassclipTests]
    dependencies:
      - target: Passclip
schemes:
  Passclip:
    build:
      targets:
        Passclip: all
    test:
      targets: [PassclipTests]
