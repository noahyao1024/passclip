name: iOS build and tests
on:
  push:
    paths: ['ios/**', 'prompts/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'prompts/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    # Xcode 26.6 on this image has the iOS 26 SDK, which the on-device email reader (FoundationModels) needs.
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios
      - name: Choose installed iPhone simulator
        run: |
          device_id=$(xcrun simctl list devices available --json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          echo "PASSCLIP_SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
      - name: Build and test
        run: xcodebuild -project ios/Passclip.xcodeproj -scheme Passclip -destination "platform=iOS Simulator,id=$PASSCLIP_SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO test
