name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit and contract tests; the signing tests use OpenSSL and Python, both on the runner.
      - run: npm test
      - run: npm run validate:examples
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run smoke:signing
